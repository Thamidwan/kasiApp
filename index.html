<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Township Find Something to Eat</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: role switch bar on top; customer app inside a phone frame beside a "try this" guide; owner and admin as web dashboards with a side nav. Kasi signage: deep green + mustard. */
:root{
  --bg:#EEF1EC; --surface:#FFFFFF; --surface-2:#F5F7F3; --ink:#18211C; --muted:#5B6860; --line:#D9DFD8;
  --brand:#0D6A4C; --brand-soft:#DCEEE5; --accent:#E9A514; --accent-soft:#FBEFCC; --on-accent:#1B1406;
  --ok:#1E7F4E; --warn:#A86A00; --bad:#B53A26; --bad-soft:#F7E1DC;
  --frame:#18211C;
  --f-display:"Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1411; --surface:#182019; --surface-2:#1F2921; --ink:#E9EFEA; --muted:#97A59C; --line:#2B362E;
  --brand:#45C18F; --brand-soft:#173527; --accent:#F2B53A; --accent-soft:#3A2E10; --on-accent:#1B1406;
  --ok:#4FCB8A; --warn:#E6AE45; --bad:#EE7A63; --bad-soft:#3B1F19; --frame:#000; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1411; --surface:#182019; --surface-2:#1F2921; --ink:#E9EFEA; --muted:#97A59C; --line:#2B362E;
  --brand:#45C18F; --brand-soft:#173527; --accent:#F2B53A; --accent-soft:#3A2E10; --on-accent:#1B1406;
  --ok:#4FCB8A; --warn:#E6AE45; --bad:#EE7A63; --bad-soft:#3B1F19; --frame:#000; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.wrap{max-width:1180px;margin:0 auto}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 12px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);margin-bottom:22px}
.brandmark{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:10px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:15px;letter-spacing:-.5px;transform:rotate(-4deg)}
.brandmark b{font-family:var(--f-display);font-weight:800;font-size:18px;display:block;line-height:1}
.brandmark small{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px;overflow-x:auto;max-width:100%}
.seg button{border:0;background:none;padding:8px 14px;border-radius:999px;font-weight:600;font-size:14px;white-space:nowrap;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.badge-demo{font-size:12px;font-weight:600;color:var(--muted);border:1px dashed var(--line);padding:4px 10px;border-radius:999px}

/* customer layout */
.cust{display:grid;grid-template-columns:auto minmax(0,1fr);gap:40px;align-items:start}
.phone{width:390px;height:min(820px,calc(100dvh - 130px));min-height:620px;border:11px solid var(--frame);border-radius:44px;background:var(--bg);position:relative;overflow:hidden;box-shadow:0 30px 60px -30px rgba(0,0,0,.45);display:flex;flex-direction:column}
.screen{position:relative;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-bottom:24px;scroll-behavior:smooth}
.guide{max-width:520px;padding-top:10px}
.guide h1{font-size:clamp(30px,4vw,46px);font-weight:800;letter-spacing:-1px}
.guide h1 em{font-style:normal;background:var(--accent);color:var(--on-accent);padding:0 .15em;border-radius:6px}
.guide p{color:var(--muted);max-width:60ch}
.tries{display:grid;gap:8px;margin:20px 0 26px}
.try{display:flex;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.try:hover{border-color:var(--brand)}
.try .k{font-family:var(--f-mono);font-size:12px;color:var(--brand);min-width:62px}
.try span:last-child{font-weight:600}
.principle{border-left:4px solid var(--accent);padding:4px 0 4px 14px;font-family:var(--f-display);font-weight:600;font-size:18px}

@media (max-width:820px){
  .cust{grid-template-columns:minmax(0,1fr)}
  .phone{width:100%;max-width:430px;margin:0 auto;height:78dvh;min-height:560px;border-width:8px;border-radius:32px}
  .guide{order:2}
}

/* in-app */
.appbar{position:sticky;top:0;z-index:3;background:var(--bg);padding:14px 16px 10px;display:flex;align-items:center;gap:10px}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.loc{display:flex;align-items:center;gap:8px;border:0;background:none;padding:0;text-align:left}
.loc small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.loc b{font-size:16px}
.pad{padding:0 16px}
.hello{font-family:var(--f-display);font-weight:800;font-size:28px;letter-spacing:-.6px;margin:6px 0 14px;line-height:1.05}
.hello span{color:var(--brand)}
.search{display:flex;gap:8px;background:var(--surface);border:1.5px solid var(--ink);border-radius:14px;padding:4px 4px 4px 14px;align-items:center}
.search input{flex:1;border:0;background:none;outline:none;padding:10px 0;min-width:0}
.search button{border:0;background:var(--accent);color:var(--on-accent);font-weight:700;border-radius:10px;padding:9px 14px}
.hint{font-size:12px;color:var(--muted);margin:8px 2px 0}
.hint button{border:0;background:none;color:var(--brand);font-weight:600;padding:0;font-size:12px;text-decoration:underline}
.sect{margin:24px 0 10px;display:flex;justify-content:space-between;align-items:baseline}
.sect h3{font-size:18px}
.sect small{color:var(--muted);font-size:12px}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cat{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 6px;display:grid;justify-items:center;gap:4px;font-size:12.5px;font-weight:600;text-align:center}
.cat .e{font-size:24px;line-height:1}
.cat:hover{border-color:var(--brand)}
.feat{display:flex;gap:10px;overflow-x:auto;padding:0 16px 4px;scroll-snap-type:x mandatory}
.featcard{flex:0 0 78%;scroll-snap-align:start;border-radius:16px;overflow:hidden;background:var(--surface);border:1px solid var(--line);text-align:left;padding:0}
.featcard .ph{height:110px}
.featcard .bd{padding:10px 12px 12px}
.ribbon{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;background:var(--accent);color:var(--on-accent);padding:3px 8px;border-radius:6px}
.ph{position:relative;color:#fff;display:flex;align-items:flex-end;padding:10px;font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.5px;overflow:hidden}
.ph::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-35deg,rgba(255,255,255,.07) 0 10px,transparent 10px 22px)}
.ph span{position:relative;z-index:1;text-shadow:0 1px 8px rgba(0,0,0,.25)}
.list{display:grid;gap:10px}
.item{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;width:100%}
.item .ph{width:72px;height:72px;border-radius:10px;font-size:20px;justify-content:center;align-items:center;padding:0}
.item h4{margin:0;font-size:15.5px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.meta{font-size:12.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.pills{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.pill{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.open{background:var(--brand-soft);color:var(--ok);border-color:transparent}
.pill.closed{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.spon{background:var(--accent-soft);color:var(--warn);border-color:transparent}
.tick{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--brand);color:var(--bg);font-size:10px;font-weight:800}
.star{color:var(--accent)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.understood{font-size:12.5px;color:var(--muted);margin:10px 0}
.understood b{color:var(--ink);background:var(--accent-soft);padding:1px 6px;border-radius:5px}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-size:18px;margin-bottom:6px}

/* profile */
.hero{height:190px;font-size:30px;padding:16px}
.prof{padding:14px 16px 0}
.prof h2{font-size:26px;font-weight:800;letter-spacing:-.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.act{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 4px;font-weight:700;font-size:13px;display:grid;justify-items:center;gap:3px}
.act.wa{background:var(--brand);color:var(--bg);border-color:var(--brand)}
.act svg{width:20px;height:20px}
.tabs{display:flex;border-bottom:1px solid var(--line);gap:4px;position:sticky;top:0;background:var(--bg);z-index:2}
.tabs button{flex:1;border:0;background:none;padding:12px 0;font-weight:600;color:var(--muted);border-bottom:3px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.menu{display:grid}
.mrow{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}
.mrow b{font-weight:600}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px 12px;font-size:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.map{border-radius:12px;overflow:hidden;border:1px solid var(--line);margin-top:14px}
.map svg{display:block;width:100%;height:auto}
.linkbtn{border:0;background:none;color:var(--bad);font-weight:600;padding:14px 0;font-size:13px}
.review{padding:12px 0;border-bottom:1px solid var(--line)}
.review .who{display:flex;justify-content:space-between;font-size:13px}
.reply{margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--surface-2);font-size:13px}
.reply b{display:block;font-size:12px;color:var(--brand)}
.stars-in{display:flex;gap:4px}
.stars-in button{border:0;background:none;font-size:26px;padding:0;color:var(--line);line-height:1}
.stars-in button.on{color:var(--accent)}
textarea,input[type=text],input[type=tel],input[type=number],select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px}
textarea{min-height:70px;resize:vertical}
.btn{border:0;background:var(--ink);color:var(--bg);font-weight:700;border-radius:10px;padding:10px 16px}
.btn.acc{background:var(--accent);color:var(--on-accent)}
.btn.brand{background:var(--brand);color:var(--bg)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.bad{background:var(--bad);color:var(--bg)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}

/* sheet */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.4);z-index:8}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:9;background:var(--surface);border-radius:20px 20px 0 0;padding:18px 18px 26px;display:grid;gap:12px}
.sheet h3{font-size:20px}
.bignum{font-family:var(--f-mono);font-size:24px;user-select:all;background:var(--surface-2);border-radius:10px;padding:10px 12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.radio{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px}

/* dashboards */
.dash{display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px;align-items:start}
.side{position:sticky;top:90px;display:grid;gap:4px}
.side .who{padding:12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);margin-bottom:10px}
.side .who b{display:block;font-family:var(--f-display);font-size:16px}
.side button{border:0;background:none;text-align:left;padding:9px 12px;border-radius:10px;font-weight:600;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.side button[aria-current="true"]{background:var(--surface);color:var(--ink);box-shadow:inset 3px 0 0 var(--accent)}
.count{font-family:var(--f-mono);font-size:12px;background:var(--accent);color:var(--on-accent);border-radius:999px;padding:1px 7px}
.main h2{font-size:28px;font-weight:800;letter-spacing:-.5px;margin-bottom:4px}
.main > p{color:var(--muted);margin:0 0 20px;max-width:65ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.panel h3{font-size:17px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat small{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stat b{font-family:var(--f-display);font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.stat em{font-style:normal;font-size:12px;color:var(--ok);font-weight:600}
.form{display:grid;gap:14px}
.field{display:grid;gap:5px}
.field label,.lbl{font-size:13px;font-weight:600}
.field .help{font-size:12px;color:var(--muted)}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:500;background:var(--surface)}
.checks input{accent-color:var(--brand)}
.switch{display:flex;gap:10px;align-items:center;font-weight:600}
.switch input{width:18px;height:18px;accent-color:var(--brand)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--surface-2)}
tr:last-child td{border-bottom:0}
.status{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;display:inline-block}
.s-live{background:var(--brand-soft);color:var(--ok)}
.s-pending{background:var(--accent-soft);color:var(--warn)}
.s-suspended,.s-rejected{background:var(--bad-soft);color:var(--bad)}
.queue{display:grid;gap:14px}
.qcard{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.qcard.risk{box-shadow:inset 4px 0 0 var(--bad)}
.vlist{display:grid;gap:6px;font-size:13.5px}
.vlist div{display:flex;gap:8px;align-items:center}
.ok{color:var(--ok);font-weight:800}.no{color:var(--bad);font-weight:800}
.note{font-size:13px;background:var(--bad-soft);color:var(--bad);padding:8px 10px;border-radius:8px;margin-top:10px}
.plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:10px;align-content:start}
.plan.cur{border-color:var(--brand)}
.plan .price{font-family:var(--f-display);font-size:28px;font-weight:800}
.plan ul{margin:0;padding-left:18px;font-size:14px;color:var(--muted)}
.menuedit{display:grid;gap:8px}
.menuedit .r{display:grid;grid-template-columns:minmax(0,1fr) 110px auto;gap:8px}
.bars text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.taglist{display:flex;flex-wrap:wrap;gap:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-weight:600;z-index:20;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast button{border:0;background:var(--accent);color:var(--on-accent);font-weight:700;border-radius:8px;padding:5px 10px}

/* production chrome */
.statusbar{flex:none;display:flex;justify-content:space-between;align-items:center;padding:10px 26px 4px;font-size:14px;font-weight:700;background:var(--bg)}
.statusbar svg{height:12px;width:auto}
.tabbar{flex:none;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--surface);padding:6px 4px 12px}
.tabbar button{border:0;background:none;display:grid;justify-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0}
.tabbar button svg{width:22px;height:22px}
.tabbar button[aria-current="true"]{color:var(--brand)}
.ic{width:20px;height:20px;flex:none}
.ph .art{position:absolute;z-index:1;filter:drop-shadow(0 6px 8px rgba(0,0,0,.18))}
.item .ph .art{inset:8%;width:84%;height:84%}
.featcard .ph .art,.hero .art{right:6%;bottom:-6%;height:118%;width:auto}
.hero .art{height:112%;bottom:-8%}
.ph.sm{width:34px;height:34px;border-radius:8px;padding:0;flex:none}
.ph.sm .art{inset:6%;width:88%;height:88%}
.ph.thumb{width:112px;height:84px;border-radius:12px;padding:0}
.ph.thumb .art{inset:8%;width:84%;height:84%}
.cat{padding:12px 6px 10px;gap:6px}
.cat .ci{width:46px;height:46px;border-radius:50%;display:grid;place-items:center}
.cat .ci svg{width:40px;height:40px}
.heart{position:absolute;top:14px;right:14px;z-index:2}
.heart[aria-pressed="true"] svg{fill:var(--bad);stroke:var(--bad)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none;border:0}
.avatar.lg{width:64px;height:64px;font-size:22px}
.rows{display:grid;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.rows button{display:flex;align-items:center;gap:12px;border:0;border-bottom:1px solid var(--line);background:none;padding:14px;text-align:left;font-weight:600}
.rows button:last-child{border-bottom:0}
.rows button span.r{margin-left:auto;color:var(--muted);font-weight:500;font-size:13px}
.side button .l{display:flex;gap:10px;align-items:center}
.side button svg{width:18px;height:18px}
.dbar{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-bottom:22px;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.dbar .crumb{font-size:13px;color:var(--muted)}
.dbar .crumb b{color:var(--ink)}
.dsearch{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:0 10px;flex:1;max-width:320px}
.dsearch input{border:0;background:none;padding:8px 0;outline:none;min-width:0;width:100%}
.bell{position:relative}
.bell::after{content:"";position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--bad);border:2px solid var(--surface)}
.namecell{display:flex;align-items:center;gap:10px}
.meter{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--brand);border-radius:99px}
.todo{display:grid;gap:8px;margin-top:12px;font-size:14px}
.todo div{display:flex;gap:8px;align-items:center}
.foot{margin-top:36px;padding-top:16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.emptyart{width:72px;height:72px;margin:0 auto 10px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:var(--muted)}
.emptyart svg{width:32px;height:32px}
@media (max-width:820px){.statusbar{display:none}}

@media (max-width:860px){
  .dbar .crumb{display:none}
  .dash{grid-template-columns:minmax(0,1fr)}
  .side{position:static;display:flex;overflow-x:auto;gap:4px}
  .side .who{display:none}
  .side button{white-space:nowrap;gap:8px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2,.plans{grid-template-columns:minmax(0,1fr)}
  .qcard{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){.screen{scroll-behavior:auto}}

function parseQuery(q){
  const s=" "+q.toLowerCase()+" ";
  let township=null,area=null;
  for(const t in D.townships){
    if(s.includes(t.toLowerCase())) township=t;
    for(const a of D.townships[t]){ if(a.length>5 && !/^Ext/.test(a) && s.includes(a.toLowerCase())){area=a;township=t;} }
  }
  const near=/near me|nearby|around me|close by/.test(s);
  const cats=D.cats.filter(c=>c.kw.some(k=>s.includes(k))||s.includes(c.label.toLowerCase())).map(c=>c.id);
  let text="";
  if(!cats.length){
    text=q.toLowerCase().replace(/\b(in|near|me|nearby|around|the|a|food|where|can|i|get|to|eat|some|something)\b/g," ");
    for(const t in D.townships){text=text.replace(t.toLowerCase()," ");D.townships[t].forEach(a=>text=text.replace(a.toLowerCase()," "))}
    text=text.replace(/\s+/g," ").trim();
  }
  if(!township||near){ if(!township){township=C.township; area=area||(near?C.area:null);} }
  return {cats,township,area,text,near};
}
function runSearch(p){
  let r=live().filter(b=>b.township===p.township);
  if(p.cats&&p.cats.length) r=r.filter(b=>b.cats.some(c=>p.cats.includes(c)));
  if(p.text){const w=p.text.split(" ");r=r.filter(b=>w.every(x=>(b.name+" "+b.tagline+" "+b.menu.map(m=>m.n).join(" ")).toLowerCase().includes(x)))}
  if(C.filters.open) r=r.filter(isOpen);
  if(C.filters.del) r=r.filter(b=>b.delivery);
  if(C.filters.ver) r=r.filter(b=>b.verified);
  r.sort((a,b)=>(!!b.featured-!!a.featured)||((b.area===p.area)-(a.area===p.area))||(rating(b).avg-rating(a).avg));
  return r;
}

function checklist(b){return [["Photos of your food",true],["Menu with prices",b.menu.length>=3],["Opening hours",!!b.hours.wk],["WhatsApp number",!!b.wa],["Delivery areas",!b.delivery||b.delAreas.length>0],["Instagram or Facebook page",!!(b.social.fb||b.social.ig)],["TikTok page (add one to reach younger customers)",!!b.social.tt],["Replied to every review",b.reviews.every(r=>r.reply)]]}
function strength(b){const c=checklist(b);return Math.round(c.filter(x=>x[1]).length/c.length*100)}
function sideNav(nav,cur,act){return nav.map(n=>`<button data-act="${act}" data-t="${n[0]}" aria-current="${cur===n[0]}"><span class="l">${n[2]}${n[1]}</span>${n[3]?`<span class="count">${n[3]}</span>`:""}</button>`).join("")}
function dbar(area,page,who){return `<div class="dbar"><div class="crumb">${esc(area)} / <b>${esc(page)}</b></div>${role==="admin"?`<label class="dsearch">${IC.search}<input id="dsearch" type="text" value="${esc(A.q||"")}" placeholder="Search businesses or areas" aria-label="Search businesses"></label>`:""}<div class="row" style="gap:8px;flex-wrap:nowrap"><button class="iconbtn bell" aria-label="Notifications" data-act="${role==="admin"?"atab":"otab"}" data-t="${role==="admin"?"approvals":"reviews"}">${IC.bell}</button><span class="avatar">${who}</span></div></div>`}
function hoursOpts(r){const opts=[[null,"Closed"],[[6,18],"06:00 – 18:00"],[[8,17],"08:00 – 17:00"],[[8,19],"08:00 – 19:00"],[[9,16],"09:00 – 16:00"],[[10,22],"10:00 – 22:00"]];
  const cur=JSON.stringify(r);if(!opts.some(o=>JSON.stringify(o[0])===cur))opts.push([r,span(r)]);
  return opts.map(o=>`<option value='${JSON.stringify(o[0])}' ${JSON.stringify(o[0])===cur?"selected":""}>${o[1]}</option>`).join("")}

  if(A.tab==="reports"){
    m=`<h2>Reports</h2><p>Reports from customers and owners about businesses and reviews.</p><div class="queue">${reps.map(r=>{const b=biz(r.biz);return `<div class="panel"><div class="row" style="justify-content:space-between"><span class="status ${r.kind==="review"?"s-pending":"s-suspended"}">${r.kind==="review"?"Review":"Business"}</span><span class="muted" style="font-size:13px">${esc(r.from)} · ${esc(r.when)}</span></div>
      <h3 style="margin:10px 0 4px">${esc(b.name)}</h3><p style="margin:0 0 4px">${esc(r.text)}</p><p class="muted" style="margin:0 0 12px;font-size:14px">Reason: ${esc(r.reason)}</p>
      <div class="row">${r.kind==="review"?`<button class="btn bad sm" data-act="rmReview" data-rep="${r.id}">Remove review</button>`:`<button class="btn bad sm" data-act="suspendRep" data-rep="${r.id}">Suspend business</button><button class="btn ghost sm" data-act="warn" data-rep="${r.id}">Ask owner to fix</button>`}<button class="btn ghost sm" data-act="dismiss" data-rep="${r.id}">Dismiss</button></div></div>`}).join("")||'<div class="panel empty"><b>No open reports</b>Customer and owner reports land here.</div>'}</div>`;
  }
  if(A.tab==="promos"){
    m=`<h2>Featured & promotions</h2><p>Businesses pay for visibility, never for being listed.</p>
    <div class="queue">${pr.map(p=>`<div class="panel row" style="justify-content:space-between"><div><b>${esc(biz(p.biz).name)}</b> requested <b>${esc(p.plan)}</b></div><div class="row"><button class="btn brand sm" data-act="promoOk" data-p="${p.id}">Activate</button><button class="btn ghost sm" data-act="promoNo" data-p="${p.id}">Decline</button></div></div>`).join("")}</div>
    <h3 style="margin:22px 0 10px">Running now</h3><div class="tablewrap"><table><thead><tr><th>Business</th><th>Placement</th><th>Until</th></tr></thead><tbody>${D.promos.filter(p=>p.status==="active").map(p=>`<tr><td>${esc(biz(p.biz).name)}</td><td>${esc(p.plan)}</td><td>${esc(p.until)}</td></tr>`).join("")}</tbody></table></div>`;
  }
  if(A.tab==="setup"){
    m=`<h2>Categories & areas</h2><p>What customers can browse. New categories show up on the app home screen immediately.</p>
    <div class="grid2"><div class="panel"><h3>Categories</h3><div class="taglist" style="margin-bottom:14px">${D.cats.map(c=>`<span class="chip">${c.e} ${esc(c.label)}</span>`).join("")}</div>
      <form data-form="addcat" class="row"><input id="newcat" type="text" placeholder="e.g. Butchery" style="flex:1;min-width:140px"><button class="btn sm">Add</button></form></div>
    <div class="panel"><h3>Townships & areas</h3>${Object.entries(D.townships).map(([t,as])=>`<div style="margin-bottom:10px"><b>${esc(t)}</b><div class="muted" style="font-size:13.5px">${as.map(esc).join(" · ")}</div></div>`).join("")}
      <form data-form="addarea" class="row" style="margin-top:12px"><select id="na-t" style="flex:1;min-width:120px">${Object.keys(D.townships).map(t=>`<option>${esc(t)}</option>`).join("")}</select><input id="na-a" type="text" placeholder="New area" style="flex:1;min-width:120px"><button class="btn sm">Add</button></form></div></div>`;
  }
  if(A.tab==="activity"){
    const lv=live().length;
    m=`<h2>Platform activity</h2><p>Sample totals for this week, plus searches made in this demo.</p>
    <div class="stats"><div class="stat"><small>Live businesses</small><b>${lv}</b></div><div class="stat"><small>Searches</small><b>2,184</b> <em>+12%</em></div><div class="stat"><small>Contact taps</small><b>963</b></div><div class="stat"><small>Pending approval</small><b>${pend.length}</b></div></div>
    <div class="grid2"><div class="panel"><h3>Latest searches</h3><table><tbody>${D.searches.slice(-8).reverse().map(s=>`<tr><td>${esc(s)}</td></tr>`).join("")}</tbody></table></div>
    <div class="panel"><h3>Listings per township</h3><table><tbody>${Object.keys(D.townships).map(t=>`<tr><td>${esc(t)}</td><td class="mono" style="text-align:right">${live().filter(b=>b.township===t).length}</td></tr>`).join("")}</tbody></table></div></div>`;
  }
  return dbar("Admin console",nav.find(n=>n[0]===A.tab)[1],"AD")+`<div class="dash"><nav class="side" aria-label="Admin sections"><div class="who"><span class="muted" style="font-size:12px">Platform admin</span><b>Moderation desk</b></div>${sideNav(nav,A.tab,"atab")}</nav><section class="main">${m}</section></div>`;
}

/* ---------------- render + events ---------------- */
function render(){
  document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.role===role));
  const root=$("#root");
  if(role==="customer"){root.innerHTML=custView();renderPhone(true)}
  if(role==="owner")root.innerHTML=ownerView();
  if(role==="admin")root.innerHTML=adminView();
}
function setRole(r){role=r;render();window.scrollTo({top:0})}
function doSearch(q){
  if(!q.trim())return;
  D.searches.push(q.toLowerCase());
  const p=parseQuery(q);p.q=q;go({s:"results",p});
}

document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el)return;
  const a=el.dataset.act,id=el.dataset.id;
  if(el.tagName==="SELECT")return;
  switch(a){
    case "role": if(el.dataset.otab)O.tab=el.dataset.otab; if(el.dataset.atab)A.tab=el.dataset.atab; setRole(el.dataset.role); break;
    case "back": back(); break;
    case "tab": if(role!=="customer"){role="customer";render()} C.stack=[{s:el.dataset.t}];C.sheet=null;renderPhone(true); if(el.dataset.t==="search")$("#q")?.focus({preventScroll:true}); break;
    case "save": {const n=+id; if(C.saved.has(n)){C.saved.delete(n);toast("Removed from saved places")}else{C.saved.add(n);toast("Saved. Find it under the Saved tab.")} renderPhone(); break;}
    case "signout": C.user=null; renderPhone(true); toast("Signed out"); break;
    case "go": C.picking=null; go({s:el.dataset.s}); break;
    case "try": if(role!=="customer")setRole("customer"); C.stack=[{s:"home"}]; doSearch(el.dataset.q); break;
    case "cat": go({s:"results",p:{cats:[el.dataset.c],township:C.township,area:C.area,text:""}}); break;
    case "open": if(role!=="customer"){role="customer";render()} if(cur().s!=="profile"||cur().id!=id) go({s:"profile",id:+id}); break;
    case "pickT": C.picking=el.dataset.t; renderPhone(); break;
    case "pickA": C.township=el.dataset.t;C.area=el.dataset.a;C.picking=null;home();toast(`Showing places around ${C.area}, ${C.township}`); break;
    case "gps": C.township="Soweto";C.area="Orlando";home();toast("Location found: Orlando, Soweto (simulated in the demo)"); break;
    case "filt": C.filters[el.dataset.f]=!C.filters[el.dataset.f]; renderPhone(); break;
    case "ptab": C.ptab=el.dataset.t; renderPhone(); break;
    case "star": C.draftStars=+el.dataset.v; const t=$("#revtext")?.value; renderPhone(); if(t&&$("#revtext"))$("#revtext").value=t; break;
    case "sheet": C.sheet={k:el.dataset.k,id:+id}; $("#sheetHost").innerHTML=sheetHtml(); break;
    case "close": C.sheet=null; $("#sheetHost").innerHTML=""; break;
    case "copy": navigator.clipboard?.writeText(el.dataset.v).then(()=>toast("Number copied"),()=>toast("Select the number to copy it")); break;
    case "flag": D.reports.push({id:Date.now(),kind:"review",biz:+id,ridx:+el.dataset.r,text:`“${biz(id).reviews[+el.dataset.r].text}”`,reason:"Flagged as fake or abusive",from:role==="owner"?"Business owner":"Customer",when:"Just now"}); toast("Review reported to the admin team","Open admin","goAdminReports"); break;
    case "goAdminReports": A.tab="reports"; setRole("admin"); break;
    case "goAdminApprovals": A.tab="approvals"; setRole("admin"); break;
    case "otab": O.tab=el.dataset.t; render(); break;
    case "atab": A.tab=el.dataset.t; render(); break;
    case "viewInApp": role="customer"; render(); go({s:"profile",id:OWNER_ID}); break;
    case "addItem": saveMenuInputs(); biz(OWNER_ID).menu.push({n:"New item",p:0}); render(); break;
    case "delItem": saveMenuInputs(); biz(OWNER_ID).menu.splice(+el.dataset.i,1); render(); break;
    case "promo": D.promos.push({id:Date.now(),biz:OWNER_ID,plan:el.dataset.p,status:"requested"}); render(); toast("Request sent. The team will confirm and invoice you.","See as admin","goAdminPromos"); break;
    case "goAdminPromos": A.tab="promos"; setRole("admin"); break;
    case "approve": {const b=biz(id);b.status="live";if(el.dataset.v)b.verified=true;render();toast(`${b.name} is live in the app`,"See it","openLast");lastOpen=b.id;break;}
    case "openLast": role="customer";render();go({s:"profile",id:lastOpen}); break;
    case "reject": {const b=biz(id);b.status="rejected";render();toast(`${b.name} rejected. The owner is told why by SMS.`);break;}
    case "verify": biz(id).verified=true; render(); toast("Verified badge added"); break;
    case "suspend": biz(id).status="suspended"; render(); toast(`${biz(id).name} hidden from the app`); break;
    case "reinstate": biz(id).status="live"; render(); toast(`${biz(id).name} is live again`); break;
    case "rmReview": {const r=D.reports.find(x=>x.id==el.dataset.rep);const b=biz(r.biz);if(r.ridx!=null&&b.reviews[r.ridx]){b.reviews.splice(r.ridx,1);if(r.ridx<b.baseReviews)b.baseReviews--}r.done=true;render();toast("Review removed");break;}
    case "suspendRep": {const r=D.reports.find(x=>x.id==el.dataset.rep);biz(r.biz).status="suspended";r.done=true;render();toast(`${biz(r.biz).name} suspended`);break;}
    case "warn": {const r=D.reports.find(x=>x.id==el.dataset.rep);r.done=true;render();toast("Owner asked to update their listing");break;}
    case "dismiss": D.reports.find(x=>x.id==el.dataset.rep).done=true; render(); toast("Report dismissed"); break;
    case "promoOk": {const p=D.promos.find(x=>x.id==el.dataset.p);p.status="active";p.until="21 Nov";const b=biz(p.biz);if(!b.featured)b.featured="featured";render();toast(`${b.name} is now featured`);break;}
    case "promoNo": D.promos.find(x=>x.id==el.dataset.p).status="declined"; render(); break;
  }
});
let lastOpen=1;
document.addEventListener("input",e=>{
  if(e.target.id!=="dsearch")return;
  A.q=e.target.value;A.tab="businesses";const pos=e.target.selectionStart;render();const i=$("#dsearch");if(i){i.focus();i.setSelectionRange(pos,pos)}
});
document.addEventListener("change",e=>{
  if(e.target.id==="upl"&&e.target.files[0]){const fr=new FileReader(),lab=e.target.closest("label");fr.onload=()=>{const b=biz(OWNER_ID);(b.uploads=b.uploads||[]).push(fr.result);const im=document.createElement("img");im.className="ph thumb";im.style.objectFit="cover";im.src=fr.result;im.alt="Uploaded photo";lab.before(im);toast("Photo added. Save changes to publish it.")};fr.readAsDataURL(e.target.files[0]);return}
  if(e.target.id==="r-t"){O.reg=e.target.value;const keep=snapshotReg();render();restoreReg(keep)}
});
function snapshotReg(){const o={};document.querySelectorAll('[data-form="register"] input').forEach(i=>o[i.id||i.value]=i.type==="checkbox"?i.checked:i.value);return o}
function restoreReg(o){document.querySelectorAll('[data-form="register"] input').forEach(i=>{const k=i.id||i.value;if(k in o){if(i.type==="checkbox")i.checked=o[k];else i.value=o[k]}})}
function saveMenuInputs(){const b=biz(OWNER_ID);b.menu.forEach((x,i)=>{const n=$("#mn"+i),p=$("#mp"+i);if(n)x.n=n.value;if(p)x.p=+p.value||0})}

document.addEventListener("submit",e=>{
  e.preventDefault();const f=e.target,k=f.dataset.form;
  if(k==="search") doSearch(f.q.value);
  if(k==="signup"){C.user={name:$("#su-name").value.trim()||"Customer",phone:$("#su-phone").value};renderPhone(true);toast("Welcome! Your account is ready.")}
  if(k==="report"){const r=f.querySelector("input:checked").value;D.reports.push({id:Date.now(),kind:"business",biz:+f.dataset.id,text:"Reported from the customer app.",reason:r,from:"Customer",when:"Just now"});C.sheet=null;$("#sheetHost").innerHTML="";toast("Thanks. An admin will look at this.","Open admin","goAdminReports")}
  if(k==="review"){const b=biz(f.dataset.id),t=f.t.value.trim();if(!C.draftStars){toast("Tap the stars to rate first");return}b.reviews.push({who:C.user?C.user.name:"You",stars:C.draftStars,text:t||"(no comment)",date:"Today"});C.draftStars=0;renderPhone();toast("Review posted")}
  if(k==="profile"){const b=biz(OWNER_ID);b.name=$("#p-name").value.trim()||b.name;b.tagline=$("#p-tag").value;b.phone=$("#p-phone").value;b.wa=$("#p-wa").value.replace(/\D/g,"");
    const cs=[...f.querySelectorAll('input[name=pc]:checked')].map(i=>i.value);if(cs.length)b.cats=cs;
    b.hours.wk=JSON.parse($("#p-wk").value);b.hours.sat=b.hours.wk;b.hours.sun=JSON.parse($("#p-sun").value);b.delivery=$("#p-del").checked;b.delAreas=$("#p-areas").value.split(",").map(s=>s.trim()).filter(Boolean);
    b.also=[...f.querySelectorAll('input[name=pa]:checked')].map(i=>i.value);b.social.fb=$("#p-fb").value;b.social.ig=$("#p-ig").value;render();toast("Saved. Your profile is updated in the app.","View in app","viewInApp")}
  if(k==="menu"){saveMenuInputs();render();toast("Menu saved. Customers see the new prices now.","View in app","viewInApp")}
  if(k==="reply"){const b=biz(OWNER_ID),i=+f.dataset.i,v=$("#rep"+i).value.trim();if(!v)return;b.reviews[i].reply=v;render();toast("Reply posted on your profile")}
  if(k==="register"){const id=++D.nextId,cats=[...f.querySelectorAll('input[name=rc]:checked')].map(i=>i.value);
    D.biz.push(B({id,name:$("#r-name").value.trim()||"New business",township:$("#r-t").value,area:$("#r-a").value,cats:cats.length?cats:["street"],hue:(id*47)%360,tagline:$("#r-tag").value,phone:$("#r-phone").value,wa:"27"+$("#r-phone").value.replace(/\D/g,"").slice(1),
      hours:W([10,20],[9,21],[10,18]),status:"pending",verified:false,submitted:"Just now",delivery:$("#r-del").checked,docs:{reg:$("#v-reg").checked,id:$("#v-id").checked,phone:true,pin:$("#v-pin").checked,photos:$("#v-ph").checked},
      menu:[{n:"Braai plate & pap",p:85},{n:"Full house kota",p:50}],rating:0,n:0,baseReviews:0}));
    O.tab="overview";render();toast("Submitted. An admin reviews it before it shows in the app.","Open admin","goAdminApprovals")}
  if(k==="addcat"){const v=$("#newcat").value.trim();if(!v)return;D.cats.push({id:"c"+Date.now(),label:v,e:"🏷",kw:[v.toLowerCase()]});render();toast(`“${v}” added to the app home screen`)}
  if(k==="addarea"){const t=$("#na-t").value,v=$("#na-a").value.trim();if(!v)return;D.townships[t].push(v);render();toast(`${v} added to ${t}`)}
});

render();
</script>
</body>
</html>
